<rect width="1400" height="760" fill="#FFFFFF"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#1F2328" font-weight="bold">Class diagram: the skill-gap engine (skillgap/skillgap.py)</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" fill="#57606A" >The matcher, the taxonomy it embeds, and the two results the service reads: a career&#x27;s demand profile and a student&#x27;s gap.</text>
