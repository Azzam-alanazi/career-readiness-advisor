<text x="56.0" y="182.0" font-size="11.5" text-anchor="start" fill="#1F2328" >+ model: SentenceTransformer</text>
<text x="56.0" y="198.0" font-size="11.5" text-anchor="start" fill="#1F2328" >+ prefix: str = &quot;query: &quot;</text>
<line x1="48.0" y1="206.0" x2="230.6" y2="206.0" stroke="#3D444D" stroke-width="1"/>
<text x="56.0" y="222.0" font-size="11.5" text-anchor="start" fill="#1F2328" >+ encode(texts: list[str]): ndarray</text>
<rect x="470.0" y="140.0" width="264.4" height="186.0" rx="0" fill="#FFFFFF" stroke="#3D444D" stroke-width="1.2"/>
<rect x="470.0" y="140.0" width="264.4" height="26.0" rx="0" fill="#E7EEF9" stroke="#3D444D" stroke-width="1.2"/>
