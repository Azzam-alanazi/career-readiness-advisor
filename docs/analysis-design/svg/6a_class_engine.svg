<text x="478.0" y="182.0" font-size="11.5" text-anchor="start" fill="#1F2328" >+ skills: list[Skill]</text>
<text x="478.0" y="198.0" font-size="11.5" text-anchor="start" fill="#1F2328" >+ embedder: Embedder</text>
