        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M1 1 L11 6 L1 11" fill="none" stroke="#3D444D" stroke-width="1.3"/>
</marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M0 1 L11 6 L0 11 z" fill="#3D444D"/>
</marker>
<marker id="hollow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M1 1 L15 8 L1 15 z" fill="#fff" stroke="#3D444D" stroke-width="1.3"/>
</marker>
<marker id="diamond" viewBox="0 0 22 12" refX="21" refY="6" markerWidth="22" markerHeight="12"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M1 6 L11 1 L21 6 L11 11 z" fill="#3D444D" stroke="#3D444D" stroke-width="1"/>
</marker>
<marker id="odiamond" viewBox="0 0 22 12" refX="21" refY="6" markerWidth="22" markerHeight="12"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M1 6 L11 1 L21 6 L11 11 z" fill="#fff" stroke="#3D444D" stroke-width="1.2"/>
</marker>
<marker id="cf-many" viewBox="0 0 20 16" refX="19" refY="8" markerWidth="20" markerHeight="16"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M19 1 L5 8 L19 15 M5 8 L19 8 M3 2 L3 14" fill="none" stroke="#3D444D" stroke-width="1.3"/>
</marker>
<marker id="cf-zmany" viewBox="0 0 26 16" refX="25" refY="8" markerWidth="26" markerHeight="16"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <circle cx="6" cy="8" r="4" fill="#fff" stroke="#3D444D" stroke-width="1.3"/>
  <path d="M25 1 L12 8 L25 15 M10 8 L25 8" fill="none" stroke="#3D444D" stroke-width="1.3"/>
</marker>
<marker id="cf-one" viewBox="0 0 20 16" refX="19" refY="8" markerWidth="20" markerHeight="16"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M8 2 L8 14 M13 2 L13 14 M0 8 L19 8" fill="none" stroke="#3D444D" stroke-width="1.3"/>
</marker>
<marker id="cf-zone" viewBox="0 0 24 16" refX="23" refY="8" markerWidth="24" markerHeight="16"
        markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <circle cx="7" cy="8" r="4" fill="#fff" stroke="#3D444D" stroke-width="1.3"/>
  <path d="M16 2 L16 14 M11 8 L23 8" fill="none" stroke="#3D444D" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1100" height="1130" fill="#FFFFFF"/>
<text x="24.0" y="34.0" font-size="17" text-anchor="start" fill="#1F2328" font-weight="bold">Activity diagram: how POST /gap turns a profile into a readiness reading</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" fill="#57606A" >One request, on the server. Nothing is stored; an unknown id ends the request with HTTP 422.</text>
<circle cx="380" cy="100" r="9" fill="#1F2328"/>
<rect x="259.3" y="125.5" width="241.4" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="146.2" font-size="12" text-anchor="middle" fill="#1F2328" >Receive StudentIn: career,</text>
<text x="380.0" y="161.8" font-size="12" text-anchor="middle" fill="#1F2328" >completed_courses, self_reported_skills</text>
<path d="M380.0 109.0 L380.0 125.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<path d="M380 205.0 L397.0 222 L380 239.0 L363.0 222 Z" fill="#FFF1DD" stroke="#3D444D" stroke-width="1.2"/>
<path d="M380.0 174.5 L380.0 205.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="724.6" y="197.5" width="150.7" height="49.0" rx="12" fill="#FCE8E6" stroke="#3D444D" stroke-width="1.2"/>
<text x="800.0" y="218.2" font-size="12" text-anchor="middle" fill="#1F2328" >422: unknown career,</text>
<text x="800.0" y="233.8" font-size="12" text-anchor="middle" fill="#1F2328" >with the known careers</text>
<path d="M397.0 222.0 L724.6 222.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<text x="560.8" y="214.0" font-size="11" text-anchor="middle" fill="#57606A" >[unknown career]</text>
<circle cx="909.356" cy="222" r="11" fill="#fff" stroke="#1F2328" stroke-width="1.4"/>
<circle cx="909.356" cy="222" r="6.5" fill="#1F2328"/>
<path d="M875.4 222.0 L898.4 222.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="278.6" y="267.5" width="202.8" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="288.2" font-size="12" text-anchor="middle" fill="#1F2328" >Drop repeated course codes and</text>
<text x="380.0" y="303.8" font-size="12" text-anchor="middle" fill="#1F2328" >skill ids, keeping their order</text>
<path d="M380.0 239.0 L380.0 267.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<text x="388.0" y="253.0" font-size="11" text-anchor="start" fill="#57606A" >[known]</text>
<path d="M380 345.0 L397.0 362 L380 379.0 L363.0 362 Z" fill="#FFF1DD" stroke="#3D444D" stroke-width="1.2"/>
<path d="M380.0 316.5 L380.0 345.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="711.3" y="345.2" width="177.4" height="33.5" rx="12" fill="#FCE8E6" stroke="#3D444D" stroke-width="1.2"/>
<text x="800.0" y="366.0" font-size="12" text-anchor="middle" fill="#1F2328" >422: unknown course codes</text>
<path d="M397.0 362.0 L711.3 362.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<text x="554.1" y="354.0" font-size="11" text-anchor="middle" fill="#57606A" >[a code not in the catalog]</text>
<circle cx="922.706" cy="362" r="11" fill="#fff" stroke="#1F2328" stroke-width="1.4"/>
<circle cx="922.706" cy="362" r="6.5" fill="#1F2328"/>
<path d="M888.7 362.0 L911.7 362.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<path d="M380 415.0 L397.0 432 L380 449.0 L363.0 432 Z" fill="#FFF1DD" stroke="#3D444D" stroke-width="1.2"/>
<path d="M380.0 379.0 L380.0 415.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="727.6" y="415.2" width="144.7" height="33.5" rx="12" fill="#FCE8E6" stroke="#3D444D" stroke-width="1.2"/>
<text x="800.0" y="436.0" font-size="12" text-anchor="middle" fill="#1F2328" >422: unknown skill ids</text>
<path d="M397.0 432.0 L727.6 432.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<text x="562.3" y="424.0" font-size="11" text-anchor="middle" fill="#57606A" >[an id not in the taxonomy]</text>
<circle cx="906.356" cy="432" r="11" fill="#fff" stroke="#1F2328" stroke-width="1.4"/>
<circle cx="906.356" cy="432" r="6.5" fill="#1F2328"/>
<path d="M872.4 432.0 L895.4 432.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<text x="388.0" y="393.0" font-size="11" text-anchor="start" fill="#57606A" >[all known]</text>
<rect x="269.1" y="477.5" width="221.7" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="498.2" font-size="12" text-anchor="middle" fill="#1F2328" >Course skills = the union of the skills</text>
<text x="380.0" y="513.8" font-size="12" text-anchor="middle" fill="#1F2328" >each completed course teaches</text>
<path d="M380.0 449.0 L380.0 477.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<text x="388.0" y="463.0" font-size="11" text-anchor="start" fill="#57606A" >[all known]</text>
<rect x="190.0" y="559.0" width="380.0" height="6.0" rx="0" fill="#1F2328" stroke="#1F2328" stroke-width="0"/>
<path d="M380.0 526.5 L380.0 559.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="172.8" y="603.5" width="154.4" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="250.0" y="624.2" font-size="12" text-anchor="middle" fill="#1F2328" >Acquired = course skills</text>
<text x="250.0" y="639.8" font-size="12" text-anchor="middle" fill="#1F2328" >∪ self-reported skills</text>
<path d="M250.0 565.0 L250.0 603.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="155.3" y="683.5" width="189.4" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="250.0" y="704.2" font-size="12" text-anchor="middle" fill="#1F2328" >analyze_gap(profile, acquired)</text>
<text x="250.0" y="719.8" font-size="12" text-anchor="middle" fill="#1F2328" >→ the combined reading</text>
<path d="M250.0 652.5 L250.0 683.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="415.6" y="643.5" width="208.7" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="520.0" y="664.2" font-size="12" text-anchor="middle" fill="#1F2328" >analyze_gap(profile, course skills)</text>
<text x="520.0" y="679.8" font-size="12" text-anchor="middle" fill="#1F2328" >→ the courses-only reading</text>
<path d="M520.0 565.0 L520.0 643.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="190.0" y="769.0" width="380.0" height="6.0" rx="0" fill="#1F2328" stroke="#1F2328" stroke-width="0"/>
<path d="M250.0 732.5 L250.0 769.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<path d="M520.0 692.5 L520.0 769.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<path d="M700 600 H1020 L1030 610 V707.0 H700 Z" fill="#FFFBE6" stroke="#3D444D" stroke-width="1"/>
<path d="M1020 600 V610 H1030" fill="none" stroke="#3D444D" stroke-width="1"/>
<text x="710.0" y="617.5" font-size="11.5" text-anchor="start" fill="#1F2328" >analyze_gap(profile, held skills):</text>
<text x="710.0" y="633.0" font-size="11.5" text-anchor="start" fill="#1F2328" >1. keep the skills with demand ≥ 0.15</text>
<text x="710.0" y="648.5" font-size="11.5" text-anchor="start" fill="#1F2328" >2. total = the sum of their demand weights</text>
<text x="710.0" y="664.0" font-size="11.5" text-anchor="start" fill="#1F2328" >3. covered = kept skills the student holds</text>
<text x="710.0" y="679.5" font-size="11.5" text-anchor="start" fill="#1F2328" >4. readiness = demand of covered ÷ total</text>
<text x="710.0" y="695.0" font-size="11.5" text-anchor="start" fill="#1F2328" >5. covered and missing, highest demand first</text>
<path d="M700.0 653.5 L624.4 668.0" fill="none" stroke="#3D444D" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="229.3" y="807.5" width="301.4" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="828.2" font-size="12" text-anchor="middle" fill="#1F2328" >Tag each covered skill “courses” when a completed</text>
<text x="380.0" y="843.8" font-size="12" text-anchor="middle" fill="#1F2328" >course teaches it, otherwise “self_reported”</text>
<path d="M380.0 775.0 L380.0 807.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="237.3" y="885.2" width="285.5" height="33.5" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="906.0" font-size="12" text-anchor="middle" fill="#1F2328" >Round each share to a whole percent, halves up</text>
<path d="M380.0 856.5 L380.0 885.2" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="242.9" y="942.5" width="274.2" height="49.0" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="963.2" font-size="12" text-anchor="middle" fill="#1F2328" >Attach the validation block:</text>
<text x="380.0" y="978.8" font-size="12" text-anchor="middle" fill="#1F2328" >gate_passed false, best F1 0.504 against 0.60</text>
<path d="M380.0 918.8 L380.0 942.5" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<rect x="287.3" y="1020.2" width="185.4" height="33.5" rx="12" fill="#E9F4EC" stroke="#3D444D" stroke-width="1.2"/>
<text x="380.0" y="1041.0" font-size="12" text-anchor="middle" fill="#1F2328" >Return GapOut; store nothing</text>
<path d="M380.0 991.5 L380.0 1020.2" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
<circle cx="380" cy="1092" r="11" fill="#fff" stroke="#1F2328" stroke-width="1.4"/>
<circle cx="380" cy="1092" r="6.5" fill="#1F2328"/>
<path d="M380.0 1053.8 L380.0 1081.0" fill="none" stroke="#3D444D" stroke-width="1.2" marker-end="url(#filled)"/>
</svg>
